<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2a33"/>
      <stop offset="100%" stop-color="#12151f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <clipPath id="round"><circle cx="48" cy="48" r="48"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="96" height="96" fill="url(#water)"/>

    <!-- 水波 -->
    <path d="M-4 28 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0" fill="none"
          stroke="#00e5ff" stroke-opacity=".16" stroke-width="1.5"/>
    <path d="M-4 36 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0" fill="none"
          stroke="#00e5ff" stroke-opacity=".10" stroke-width="1.5"/>
    <path d="M-4 76 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0" fill="none"
          stroke="#a855f7" stroke-opacity=".14" stroke-width="1.5"/>

    <!-- 鱼身 -->
    <ellipse cx="46" cy="56" rx="25" ry="19" fill="url(#body)"/>

    <!-- 尾鳍 -->
    <path d="M22 56 L6 42 L11 56 L6 70 Z" fill="#ffb347" stroke="#e8850f"
          stroke-width="1.4" stroke-linejoin="round"/>

    <!-- 背鳍（弧线，别做成尖角） -->
    <path d="M36 39 Q42 28 49 27 Q54 30 54 33 Q46 36 46 37 Z"
          fill="#ffc76b" stroke="#e8850f" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- 胸鳍 -->
    <path d="M44 64 Q51 74 58 67 Q51 66 44 64 Z"
          fill="#ffc76b" stroke="#e8850f" stroke-width="1.2"/>

    <!-- 眼睛 -->
    <circle cx="56" cy="48" r="6" fill="#fff"/>
    <circle cx="57.5" cy="48.5" r="3.2" fill="#1b1f2a"/>
    <circle cx="58.8" cy="46.9" r="1.1" fill="#fff"/>

    <!-- 腮红 -->
    <ellipse cx="48" cy="62" rx="5.5" ry="3" fill="#f87171" opacity=".5"/>

    <!-- 嘴 -->
    <path d="M62 58 Q67 66 71 62" fill="none" stroke="#c2410c"
          stroke-width="2" stroke-linecap="round"/>

    <!-- 耳机 -->
    <path d="M32 52 Q32 28 50 24 Q68 28 68 48" fill="none"
          stroke="#e6e9f0" stroke-width="4" stroke-linecap="round" opacity=".95"/>
    <rect x="26" y="44" width="10" height="16" rx="5" fill="#00e5ff"/>
    <rect x="64" y="38" width="10" height="16" rx="5" fill="#00e5ff"/>
    <rect x="28.5" y="48" width="5" height="8" rx="2.5" fill="#0a0c12" opacity=".65"/>
    <rect x="66.5" y="42" width="5" height="8" rx="2.5" fill="#0a0c12" opacity=".65"/>

    <!-- 外环 -->
    <circle cx="48" cy="48" r="46" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>
</svg>
